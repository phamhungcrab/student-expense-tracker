<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Expense Tracker</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>Student Expense Tracker</h1>
            <p class="subtitle">Track your monthly spending easily</p>
        </header>

        <!-- Expense Input Form -->
        <section class="form-section">
            <h2>Add New Expense</h2>
            <form id="expenseForm">
                <div class="form-group">
                    <label for="amount">Amount ($)</label>
                    <input type="number" id="amount" name="amount" step="0.01" min="0.01" required>
                </div>
                
                <div class="form-group">
                    <label for="category">Category</label>
                    <select id="category" name="category" required>
                        <option value="" disabled selected>Select a category</option>
                        <option value="Food">Food</option>
                        <option value="Transport">Transport</option>
                        <option value="Books">Books</option>
                        <option value="Entertainment">Entertainment</option>
                        <option value="Bills">Bills</option>
                        <option value="Shopping">Shopping</option>
                        <option value="Other">Other</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="date">Date</label>
                    <input type="date" id="date" name="date" required>
                </div>

                <div class="form-group">
                    <label for="description">Description</label>
                    <input type="text" id="description" name="description" placeholder="e.g., Groceries">
                </div>

                <button type="submit" class="btn">Add Expense</button>
            </form>
        </section>

        <!-- Monthly Summary -->
        <section class="summary-section">
            <h2>Monthly Summary</h2>
            <div class="summary-cards">
                <div class="card">
                    <h3>Month</h3>
                    <p id="currentMonth">-</p>
                </div>
                <div class="card">
                    <h3>Number of Expenses</h3>
                    <p id="expenseCount">0</p>
                </div>
                <div class="card">
                    <h3>Daily Average</h3>
                    <p id="dailyAverage">$0.00</p>
                </div>
                <div class="card">
                    <h3>Highest Expense</h3>
                    <p id="highestExpense">$0.00</p>
                </div>
            </div>
        </section>

        <!-- Category Breakdown -->
        <section class="breakdown-section">
            <h2>Category Breakdown</h2>
            <div id="categoryBreakdown">
                <p class="no-data">No expenses recorded yet.</p>
            </div>
        </section>

        <!-- Expense List -->
        <section class="list-section">
            <h2>Your Expenses</h2>
            <div id="expenseList">
                <p class="no-data">No expenses yet. Add one above!</p>
            </div>
        </section>
    </div>

    <script src="app.js"></script>
</body>
</html>
